# GFlowNet-based molecule experiment: SELFIES + exact DKL + MF-MES across three xTB fidelities.
#
# Run with:
#   uv run activelearning-molecules applications/molecules/config/gflownet_exact_multi_fidelity.yaml
#
# This keeps the exact-GP variant intentionally smaller than the variational
# multi-fidelity example (gflownet_variational_multi_fidelity.yaml):
# - GFlowNetSampler trains a generative policy to propose (SELFIES, fidelity) pairs;
#   fidelity_action: any lets the policy choose any of the three fidelity levels.
# - ExactDKLSurrogate fits an exact GP that conditions on both molecule features
#   and a fidelity confidence embedding at target fidelity 3.
# - QMultiFidelityLowerBoundMaxValueEntropy (MF-MES) scores each (molecule, fidelity)
#   pair by expected information gain about the optimum at target fidelity 3. This score
#   is used directly as the GFlowNet reward, so the policy trades off information gain
#   against cost when deciding which (molecule, fidelity) pairs to propose.

runtime:
  device: cpu
  precision: 64
  seed: 42

dataset:
  type: ListDataset

surrogate:
  type: ExactDKLSurrogate
  target_fidelity: 3
  encoder:
    type: SelfiesTransformerEncoder
    max_mol_tokens: 18
    embed_dim: 32
    ff_dim: 64
    num_heads: 4
    num_layers: 2
    latent_dim: 32
    dropout: 0.0
  training_params:
    epochs: 10
    lr: 1.0e-3
    mask_ratio: 0.125
    pretrain_epochs: 0
  standardize_outputs: true

acquisition:
  type: QMultiFidelityLowerBoundMaxValueEntropy
  candidate_set_spec:
    type: TrainDataCandidateSetSpec
  num_fantasies: 8
  num_mv_samples: 10
  num_y_samples: 64
  maximize: true

sampler:
  type: GFlowNetSampler
  n_samples: 64
  fidelities: [1, 2, 3]
  fidelity_action: any
  conf:
    env:
      _target_: gflownet.envs.sequences.selfies.Selfies
      env_id: selfies
      id: selfies
      max_length: 8
    gflownet:
      optimizer:
        lr: 5.0e-4
        lr_z_mult: 20
        n_train_steps: 100
        batch_size:
          forward: 32

selector:
  type: TopKAcquisitionSelector
  num_samples: 8

oracle:
  type: XTBIPEAOracle
  task: ea
  fidelity_costs:
    1: 1.0
    2: 3.5
    3: 7.0
  # Optional overrides; unlisted fidelities fall back to num_conformers (default: 2).
  per_fidelity_num_conformers:
    1: 1
    2: 2
    3: 4
  gfn_version: 2
  ff: mmff
  log_molecule_visualizations: true
  molecule_visualization_limit: 25

budget:
  available_budget: 168.0
  schedule:
    type: constant
    # Worst-case cost of querying 8 candidates at the highest fidelity.
    value: 56.0

logger:
  type: ConsoleLogger
  project_name: activelearning_tutorials
  run_name: molecules-gflownet-selfies-exact-multi-fidelity
