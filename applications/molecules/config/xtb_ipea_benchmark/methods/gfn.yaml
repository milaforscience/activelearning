sampler:
  type: GFlowNetSampler
  n_samples: 640
  # Sampling is sync-bound on CUDA; running the agent on CPU is ~2x faster.
  device: cpu
  # Stack (fidelity after the molecule) instead of SetFix ("any"): SetFix adds
  # two toggle steps per token, making trajectories ~3x longer. No effect for
  # single-fidelity runs.
  fidelity_action: last
  conf:
    env:
      _target_: activelearning_molecules.samplers.gflownet_envs.SelfiesSmiles
      env_id: selfies
      id: selfies
      max_length: 64
    gflownet:
      optimizer:
        lr: 5.0e-4
        lr_z_mult: 20
        n_train_steps: 5000
        batch_size:
          forward: 64
