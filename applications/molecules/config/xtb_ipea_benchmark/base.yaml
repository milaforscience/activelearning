runtime:
  device: cuda
  precision: 32
  seed: 42

dataset:
  type: ListDataset

surrogate:
  type: ExactGPSurrogate
  standardize_outputs: true

selector:
  type: CostAwareSelector

budget:
  available_budget: 1260.0
  schedule:
    type: constant
    value: 896.0

logger:
  type: MultiLogger
  run_name: molecule-benchmark-seed${runtime.seed}
  loggers:
    - type: ConsoleLogger
      project_name: xtb_ipea_benchmark
      run_name: ${logger.run_name}
    - type: CometLogger
      project_name: xtb_ipea_benchmark
      run_name: ${logger.run_name}

run_writer:
  type: JSONLinesRunWriter
  output_dir: outputs/xtb_ipea_benchmark/default/seed_${runtime.seed}

diagnostics:
  enabled: true
  figure_interval: 1
  max_points: 1000
