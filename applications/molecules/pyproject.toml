[project]
name = "activelearning-molecules"
version = "0.1.0"
description = "Molecular application components for the activelearning framework"
authors = [
    {name = "pedromsferraz-mila", email = "pedro.ferraz@mila.quebec"},
    {name = "alexhernandezgarcia", email = "alex.hernandez-garcia@mila.quebec"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "activelearning",
    "minimol==1.3.5",
    "selfies>=2.2.0",
    "rdkit>=2026.3.1",
    "transformers==4.35.2",
    "huggingface-hub>=0.34.3",
    # MiniMol imports pkg_resources, which was removed from newer setuptools.
    "setuptools<81",
    # Graphium's compiled PyG dependencies use local versions on Linux.
    "torch-cluster==1.6.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch-scatter==2.1.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch-sparse==0.6.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch-cluster==1.6.3+pt25cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch-scatter==2.1.2+pt25cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch-sparse==0.6.18+pt25cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
activelearning-molecules = "activelearning_molecules.main:main"

[build-system]
requires = ["uv_build >= 0.9.26, <0.10.0"]
build-backend = "uv_build"
