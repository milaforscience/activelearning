# GFlowNet-based tutorial: SELFIES molecule search with exact DKL + single-fidelity xTB.
#
# Run with:
#   uv run --extra molecules activelearning config/molecules/gflownet_exact.yaml
#
# This example keeps the setup intentionally small:
# - GFlowNet samples SELFIES strings directly.
# - The surrogate is an exact-DKL model over SELFIES strings.
# - The oracle only uses fidelity 1 so the run stays cheap and easy to follow.
#
# GFlowNet component defaults are loaded from config/gflownet/ by
# compose_gflownet_conf. The sampler.conf block below only overrides the parts
# specific to the molecules use case.

runtime:
  device: cpu
  precision: 64
  seed: 42

dataset:
  type: ListDataset

surrogate:
  type: ExactSelfiesDKLSurrogate
  encoder:
    type: SelfiesTransformerEncoder
    max_length: 16
    embed_dim: 32
    ff_dim: 64
    num_heads: 4
    num_layers: 2
    latent_dim: 32
    dropout: 0.0
  training_params:
    epochs: 10
    lr: 1.0e-3
    mask_ratio: 0.125
    pretrain_epochs: 0
  standardize_outputs: true

acquisition:
  type: UpperConfidenceBound
  beta: 2.0

sampler:
  type: GFlowNetSampler
  n_samples: 16
  fixed_fidelity: 1
  conf:
    env:
      _target_: gflownet.envs.sequences.selfies.Selfies
      env_id: selfies
      id: selfies
      max_length: 8
    gflownet:
      optimizer:
        lr: 5.0e-4
        lr_z_mult: 20
        n_train_steps: 25
        batch_size:
          forward: 16

selector:
  type: TopKAcquisitionSelector
  num_samples: 1

oracle:
  type: XTBIPEAOracle
  task: ea
  fidelity_costs:
    1: 1.0
  gfn_version: 2
  ff: mmff

budget:
  available_budget: 3.0
  schedule:
    type: constant
    value: 1.0

logger:
  type: ConsoleLogger
  project_name: activelearning_tutorials
  run_name: molecules-gflownet-selfies-exact
