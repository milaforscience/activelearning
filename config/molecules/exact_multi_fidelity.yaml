# Molecule IP/EA optimisation with exact SELFIES DKL + MF-MES over three xTB fidelities.
#
# This extends the single-fidelity pool example (exact.yaml) by adding multi-fidelity
# surrogate models and acquisition functions. The main differences are:
# - ExactSelfiesDKLSurrogate is reused but with multi_fidelity enabled, so the GP also
#   conditions on a fidelity confidence embedding alongside molecule features.
# - PoolFileSampler proposes (molecule, fidelity) pairs from a fixed candidate file,
#   covering all three xTB fidelity levels (1 = cheapest / fastest, 3 = most accurate).
# - QMultiFidelityLowerBoundMaxValueEntropy (MF-MES) scores each (molecule, fidelity)
#   pair by how much information it would provide about the optimum at target fidelity 3.
# - CostAwareSelector picks which pairs to query by dividing MF-MES scores by oracle
#   cost, so the optimizer naturally favours cheap fidelities when they are informative.
#   Cost is discounted here in the selector rather than inside the acquisition function
#   because the pool-based active-learning loop evaluates acquisition scores first and
#   then selects separately; applying a cost penalty in both steps would discount it twice.
#
# Run with:
#   uv run activelearning config/molecules/exact_multi_fidelity.yaml

runtime:
  device: cpu
  precision: 64

dataset:
  type: ListDataset

surrogate:
  type: ExactSelfiesDKLSurrogate
  multi_fidelity: true
  target_fidelity: 3
  encoder:
    type: SelfiesTransformerEncoder
    max_mol_tokens: 64
    embed_dim: 64
    ff_dim: 256
    num_heads: 8
    num_layers: 8
    latent_dim: 64
    dropout: 0.0
  training_params:
    epochs: 50
    lr: 1.0e-3
    mask_ratio: 0.125
    pretrain_epochs: 0
  standardize_outputs: true

acquisition:
  type: QMultiFidelityLowerBoundMaxValueEntropy
  candidate_set_spec:
    type: TrainDataCandidateSetSpec
  num_fantasies: 16
  num_mv_samples: 10
  num_y_samples: 128
  maximize: true

sampler:
  type: PoolFileSampler
  candidate_pool_file: config/data/molecules.txt
  num_samples: 1000
  fidelities:
    - 1
    - 2
    - 3

selector:
  type: CostAwareSelector

oracle:
  type: XTBIPEAOracle
  task: ea
  fidelity_costs:
    1: 1.0
    2: 3.5
    3: 7.0
  gfn_version: 2
  ff: mmff
  log_molecule_visualizations: true
  molecule_visualization_limit: 25

budget:
  available_budget: 500.0
  schedule:
    type: constant
    value: 50.0

logger:
  type: ConsoleLogger
  project_name: molecule_dkl
  run_name: molecules-dkl-exact-multi-fidelity-ea
