# Molecule IP/EA optimisation with exact SELFIES DKL + MF-MES over three xTB fidelities.
#
# This extends the single-fidelity pool example by:
# - keeping the exact SELFIES DKL surrogate,
# - exposing xTB fidelities 1 / 2 / 3 in the pool sampler,
# - using MF-MES to score candidates,
# - and using cost-aware selection so cheap fidelities are preferred when informative.
#
# Run with:
#   uv run activelearning config/molecules/exact_multi_fidelity.yaml

runtime:
  device: cpu
  precision: 64

dataset:
  type: ListDataset

surrogate:
  type: ExactSelfiesDKLSurrogate
  multi_fidelity: true
  target_fidelity: 3
  encoder:
    type: SelfiesTransformerEncoder
    max_length: 64
    embed_dim: 64
    ff_dim: 256
    num_heads: 8
    num_layers: 8
    latent_dim: 64
    dropout: 0.0
  training_params:
    epochs: 50
    lr: 1.0e-3
    mask_ratio: 0.125
    pretrain_epochs: 0
  standardize_outputs: true

acquisition:
  type: QMultiFidelityLowerBoundMaxValueEntropy
  candidate_set_spec:
    type: TrainDataCandidateSetSpec
  num_fantasies: 16
  num_mv_samples: 10
  num_y_samples: 128
  maximize: true
  cost_aware_utility:
    type: FidelityCostUtility
    fidelity_costs:
      1: 1.0
      2: 3.5
      3: 7.0

sampler:
  type: PoolFileSampler
  candidate_pool_file: config/data/molecules.txt
  num_samples: 1000
  fidelities:
    - 1
    - 2
    - 3

selector:
  type: CostAwareSelector

oracle:
  type: XTBIPEAOracle
  task: ea
  fidelity_costs:
    1: 1.0
    2: 3.5
    3: 7.0
  gfn_version: 2
  ff: mmff
  log_molecule_visualizations: true
  molecule_visualization_limit: 25

budget:
  available_budget: 500.0
  schedule:
    type: constant
    value: 50.0

logger:
  type: ConsoleLogger
  project_name: molecule_dkl
  run_name: molecules-dkl-exact-multi-fidelity-ea
