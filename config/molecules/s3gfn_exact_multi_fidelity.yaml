# S3-GFN molecule experiment: one SMILES policy with an explicit terminal
# fidelity action.
#
# The sampler and frozen surrogate intentionally repeat the model and tokenizer
# identifiers: the sampler owns a trainable policy while the surrogate owns a
# frozen prior. Each component therefore loads its own weights; plan for the
# corresponding additional memory during a real run.
# `sampler.max_length` and `surrogate.encoder.max_mol_tokens` are kept equal
# here for comparable tokenization, but control independent components.

runtime:
  device: cpu
  precision: 64
  seed: 42

dataset:
  type: ListDataset

surrogate:
  type: ExactDKLSurrogate
  is_multi_fidelity: true
  target_fidelity: 3
  encoder:
    type: GPMoLFormerSmilesEncoder
    model_name_or_path: ibm-research/GP-MoLFormer-Uniq
    tokenizer_name_or_path: ibm-research/MoLFormer-XL-both-10pct
    max_mol_tokens: 140
    latent_dim: 32
  training_params:
    epochs: 10
    lr: 1.0e-3
  standardize_outputs: true

acquisition:
  type: QMultiFidelityLowerBoundMaxValueEntropy
  candidate_set_spec:
    type: TrainDataCandidateSetSpec
  num_fantasies: 8
  num_mv_samples: 10
  num_y_samples: 64
  maximize: true

sampler:
  type: S3GFNSampler
  n_samples: 64
  fidelities: [1, 2, 3]
  model_name_or_path: ibm-research/GP-MoLFormer-Uniq
  tokenizer_name_or_path: ibm-research/MoLFormer-XL-both-10pct
  trust_remote_code: true
  max_length: 140
  batch_size: 16
  replay_batch_size: 16
  n_train_steps: 25
  num_warmup_steps: 5
  beta: 25.0
  aux_coefficient: 0.001
  sa_threshold: 4.0

selector:
  type: TopKAcquisitionSelector
  num_samples: 8

oracle:
  type: XTBIPEAOracle
  task: ea
  fidelity_costs:
    1: 1.0
    2: 3.5
    3: 7.0
  per_fidelity_num_conformers:
    1: 1
    2: 2
    3: 4
  gfn_version: 2
  ff: mmff
  mol_repr: smiles

budget:
  available_budget: 168.0
  schedule:
    type: constant
    value: 56.0

logger:
  type: ConsoleLogger
  project_name: activelearning_tutorials
  run_name: molecules-s3gfn-exact-multi-fidelity
