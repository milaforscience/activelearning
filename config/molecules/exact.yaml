# Molecule IP/EA optimisation with exact SELFIES DKL + single-fidelity pool sampling.
#
# This is the smallest pool-based molecule example:
# - ExactSelfiesDKLSurrogate models SELFIES strings directly.
# - PoolFileSampler draws candidate molecules from a fixed file.
# - Only fidelity 1 is available, so the setup stays cheap.
# - UpperConfidenceBound gives a simple single-fidelity acquisition baseline.
#
# Run with:
#   uv run activelearning config/molecules/exact.yaml

runtime:
  device: cpu
  precision: 64

dataset:
  type: ListDataset

surrogate:
  type: ExactSelfiesDKLSurrogate
  encoder:
    type: SelfiesTransformerEncoder
    max_length: 64
    embed_dim: 64
    ff_dim: 256
    num_heads: 8
    num_layers: 8
    latent_dim: 64
    dropout: 0.0
  training_params:
    epochs: 50
    lr: 1.0e-3
    mask_ratio: 0.125
    pretrain_epochs: 0
  standardize_outputs: true

acquisition:
  type: UpperConfidenceBound
  beta: 2.0

sampler:
  type: PoolFileSampler
  candidate_pool_file: config/data/molecules.txt
  num_samples: 1000
  fidelities:
    - 1

selector:
  type: TopKAcquisitionSelector
  num_samples: 50

oracle:
  type: XTBIPEAOracle
  task: ea
  fidelity_costs:
    1: 1.0
  gfn_version: 2
  ff: mmff
  log_molecule_visualizations: true
  molecule_visualization_limit: 25

budget:
  available_budget: 500.0
  schedule:
    type: constant
    value: 50.0

logger:
  type: ConsoleLogger
  project_name: molecule_dkl
  run_name: molecules-dkl-exact-single-fidelity-ea
