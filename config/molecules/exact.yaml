# Molecule IP/EA optimisation with exact SELFIES DKL + single-fidelity pool sampling.
#
# This is the simplest pool-based molecule example: at each active-learning cycle,
# candidates are drawn from a fixed file rather than generated by a model like a GFlowNet.
# - ExactSelfiesDKLSurrogate fits a GP with a deep-kernel-learning SELFIES transformer
#   encoder, and predicts electron affinity (EA) for each candidate molecule.
# - UpperConfidenceBound scores candidates by predicted mean plus a confidence bonus,
#   trading off exploitation and exploration.
# - TopKAcquisitionSelector picks the top 50 highest-scoring candidates to evaluate.
# Only fidelity 1 (the cheapest xTB approximation) is used to keep oracle calls fast
# and the overall setup easy to follow.
#
# Run with:
#   uv run activelearning config/molecules/exact.yaml

runtime:
  device: cpu
  precision: 64

dataset:
  type: ListDataset

surrogate:
  type: ExactSelfiesDKLSurrogate
  encoder:
    type: SelfiesTransformerEncoder
    max_length: 64
    embed_dim: 64
    ff_dim: 256
    num_heads: 8
    num_layers: 8
    latent_dim: 64
    dropout: 0.0
  training_params:
    epochs: 50
    lr: 1.0e-3
    mask_ratio: 0.125
    pretrain_epochs: 0
  standardize_outputs: true

acquisition:
  type: UpperConfidenceBound
  beta: 2.0

sampler:
  type: PoolFileSampler
  candidate_pool_file: config/data/molecules.txt
  num_samples: 1000
  fidelities:
    - 1

selector:
  type: TopKAcquisitionSelector
  num_samples: 50

oracle:
  type: XTBIPEAOracle
  task: ea
  fidelity_costs:
    1: 1.0
  gfn_version: 2
  ff: mmff
  log_molecule_visualizations: true
  molecule_visualization_limit: 25

budget:
  available_budget: 500.0
  schedule:
    type: constant
    value: 50.0

logger:
  type: ConsoleLogger
  project_name: molecule_dkl
  run_name: molecules-dkl-exact-single-fidelity-ea
