# GFlowNet-based molecule experiment: SELFIES + variational DKL + MF-MES across three xTB fidelities.
#
# This is the most expressive molecule tutorial example; run after the exact
# multi-fidelity variant (gflownet_exact_multi_fidelity.yaml):
# - GFlowNetSampler trains a generative policy to propose (SELFIES, fidelity) pairs
#   in proportion to their MF-MES acquisition scores, exploring all three fidelities.
# - VariationalDKLSurrogate replaces the exact GP with an inducing-point
#   variational GP, which scales to larger datasets at the cost of more training epochs.
# - QMultiFidelityLowerBoundMaxValueEntropy (MF-MES) scores each (molecule, fidelity)
#   pair by expected information gain about the target-fidelity optimum. This score is
#   used as the GFlowNet reward, so the policy trades off information gain against
#   cost when deciding which (molecule, fidelity) pairs to propose.
# - xTB fidelities use costs 1.0 / 3.5 / 7.0 and conformer counts 1 / 2 / 4.
# - Acquisition batch size B=128, GFlowNet sample count N=5*B=640.
#
# Prerequisites:
#   - The `xtb` binary on PATH for oracle evaluation
#   - uv sync --extra molecules
#
# Run with:
#   uv run activelearning config/molecules/gflownet_variational_multi_fidelity.yaml

runtime:
  device: cpu
  precision: 64
  seed: 42

dataset:
  type: ListDataset

surrogate:
  type: VariationalDKLSurrogate
  target_fidelity: 3
  encoder:
    type: SelfiesTransformerEncoder
    max_mol_tokens: 66
    embed_dim: 64
    ff_dim: 256
    num_heads: 8
    num_layers: 8
    latent_dim: 32
    dropout: 0.0
  training_params:
    epochs: 512
    lr: 1.0e-3
    mask_ratio: 0.125
    pretrain_epochs: 0
  num_inducing: 64
  standardize_outputs: true

acquisition:
  type: QMultiFidelityLowerBoundMaxValueEntropy
  candidate_set_spec:
    type: TrainDataCandidateSetSpec
  num_fantasies: 16
  num_mv_samples: 10
  num_y_samples: 128
  maximize: true

sampler:
  type: GFlowNetSampler
  n_samples: 640
  fidelities: [1, 2, 3]
  fidelity_action: any
  conf:
    env:
      _target_: gflownet.envs.sequences.selfies.Selfies
      env_id: selfies
      id: selfies
      max_length: 64
    proxy:
      reward_function: identity
      reward_beta: 1.0e-6
      reward_rho: 1.5
      reward_min: 1.0e-8
    policy:
      forward:
        n_hid: 2048
        n_layers: 2
    gflownet:
      optimizer:
        lr: 5.0e-4
        lr_z_mult: 20
        adam_beta1: 0.0
        adam_beta2: 1.0e-2
        n_train_steps: 5000
        batch_size:
          forward: 128

selector:
  type: TopKAcquisitionSelector
  num_samples: 128

oracle:
  type: XTBIPEAOracle
  task: ea
  fidelity_costs:
    1: 1.0
    2: 3.5
    3: 7.0
  # Optional overrides; unlisted fidelities fall back to num_conformers (default: 2).
  per_fidelity_num_conformers:
    1: 1
    2: 2
    3: 4
  gfn_version: 2
  ff: mmff
  correction_factor: 4.8455
  log_molecule_visualizations: true
  molecule_visualization_limit: 25

budget:
  available_budget: 1260.0
  schedule:
    type: constant
    # Worst-case cost of querying B=128 candidates at the highest fidelity.
    value: 896.0

logger:
  type: ConsoleLogger
  project_name: activelearning_tutorials
  run_name: molecules-gflownet-selfies-variational-multi-fidelity
