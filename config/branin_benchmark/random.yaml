# Benchmark overlay: random baseline for the shared Branin benchmark suite.
#
# Run with:
#   uv run activelearning config/branin_benchmark/base.yaml config/branin_benchmark/random.yaml runtime.seed=<seed>

oracle:
  type: BraninOracle
  fidelity_costs:
    1: 0.01
    2: 0.1
    3: 1.0
  fidelity_confidences:
    1: 0.1
    2: 0.5
    3: 1.0

sampler:
  type: HypercubeSampler
  num_samples: ${branin_benchmark.candidate_sample_count}
  bounds: ${branin_benchmark.domain_bounds}
  point_strategy: uniform
  fidelities: [1, 2, 3]

branin_benchmark:
  method: random
  method_label: Random
