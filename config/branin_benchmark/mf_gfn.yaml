# Benchmark overlay: MF-GFN for the shared Branin benchmark suite.
#
# Run with:
#   uv run activelearning config/branin_benchmark/base.yaml config/branin_benchmark/mf_gfn.yaml runtime.seed=<seed>

oracle:
  type: BraninOracle
  fidelity_costs:
    1: 0.01
    2: 0.1
    3: 1.0
  fidelity_confidences:
    1: 0.1
    2: 0.5
    3: 1.0

branin_benchmark:
  method: mf_gfn
  method_label: MF-GFN
