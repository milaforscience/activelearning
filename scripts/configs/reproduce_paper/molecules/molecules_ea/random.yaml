runtime:
  device: cpu
  precision: 32
  seed: 42

dataset:
  type: ListDataset
  initial_data:
    path: ${reproduce_paper.initial_data.multi}
    x_columns: selfies
    y_column: y
    fidelity_column: fidelity
    metadata_columns: remaining

surrogate:
  type: VariationalSelfiesDKLSurrogate
  encoder:
    type: SelfiesTransformerEncoder
    max_length: 64
    embed_dim: 64
    ff_dim: 256
    num_heads: 8
    num_layers: 8
    latent_dim: 32
    dropout: 0.0
  training_params:
    epochs: 512
    lr: 0.001
    mask_ratio: 0.125
    pretrain_epochs: 0
  num_inducing: 64
  standardize_outputs: true
  multi_fidelity: true
  target_fidelity: 3

acquisition:
  type: QMultiFidelityLowerBoundMaxValueEntropy
  candidate_set_spec:
    type: TrainDataCandidateSetSpec
  cost_aware_utility:
    type: FidelityCostUtility
    fidelity_costs: ${reproduce_paper.oracle_costs}

sampler:
  type: RandomTokenSequenceSampler
  num_samples: ${reproduce_paper.candidate_sample_count}
  tokens: SELFIES_VOCAB_SMALL
  min_length: 1
  max_length: 64
  fidelity_policy:
    type: uniform
    values: [1, 2, 3]

selector:
  type: TopKAcquisitionSelector
  num_samples: 128

oracle:
  type: XTBIPEAOracle
  task: ea
  fidelity_costs: ${reproduce_paper.oracle_costs}
  per_fidelity_num_conformers:
    1: 1
    2: 2
    3: 4

budget:
  available_budget: 1260.0
  schedule:
    type: constant
    value: 896.0

logger:
  type: ConsoleLogger
  project_name: activelearning_paper_reproduction
  run_name: ${reproduce_paper.task}-${reproduce_paper.method}-seed${runtime.seed}

run_writer:
  type: JSONLinesRunWriter
  output_dir: outputs/reproduce_paper/${reproduce_paper.task}/${reproduce_paper.method}/seed_${runtime.seed}

reproduce_paper:
  task_group: molecules
  task: molecules_ea
  task_label: Molecules (EA)
  method: random
  method_label: Random
  top_k: 100
  initial_data:
    multi: scripts/configs/reproduce_paper/data/molecules_ea/initial_multi_fidelity.csv
    single: scripts/configs/reproduce_paper/data/molecules_ea/initial_single_fidelity.csv
  oracle_costs:
    1: 1.0
    2: 3.5
    3: 7.0
  candidate_sample_count: 640
  molecule_representation: selfies
  gflownet:
    optimizer_batch_size: 32
    reward_beta: 1.0e-06
    reward_rho: 1.5
