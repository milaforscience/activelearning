runtime:
  device: cpu
  precision: 64
  seed: 42

dataset:
  type: ListDataset
  initial_data:
    path: scripts/configs/censored_branin_experiments/data/initial_two_fidelity.csv
    x_columns: [x1, x2]
    y_column: y
    fidelity_column: fidelity
    metadata_columns: remaining

surrogate:
  type: BoTorchGPSurrogate

acquisition:
  type: QMultiFidelityLowerBoundMaxValueEntropy
  candidate_set_spec:
    type: TrainDataCandidateSetSpec

sampler:
  type: HypercubeGridSampler
  bounds:
    - [-5.0, 10.0]
    - [0.0, 15.0]
  points_per_dimension: [100, 100]
  fidelities: [1, 2]
  num_samples: 10
  use_acquisition_scores: true

selector:
  type: TopKAcquisitionSelector
  num_samples: 1

oracle:
  type: CensoredSyntheticOracle
  function: branin
  threshold:
    1: -134.39
    2: 0.0
  fidelity_costs:
    1: 0.1
    2: 1.0
  fidelity_confidences:
    1: 0.1
    2: 1.0

budget:
  available_budget: 100.0
  max_rounds: 300
  schedule:
    type: constant
    value: 1.0

logger:
  type: ConsoleLogger
  project_name: censored_branin_benchmark
  run_name: ${experiment.name}-${experiment.method}-seed${runtime.seed}

run_writer:
  type: JSONLinesRunWriter
  output_dir: outputs/censored_branin_benchmark/${experiment.name}/${experiment.method}/seed_${runtime.seed}

experiment:
  name: default
  method: mf_gfn
  top_k: 50
  negate_score: true
