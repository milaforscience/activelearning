[project]
name = "activelearning"
version = "0.1.0"
description = "Multi-fidelity active learning with GFlowNets"
authors = [
    {name = "pedromsferraz-mila", email = "pedro.ferraz@mila.quebec"},
    {name = "alexhernandezgarcia", email = "alex.hernandez-garcia@mila.quebec"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "botorch>=0.16.1",
    "matplotlib>=3.10.8",
    "numpy>=1.26.0,<3.0.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "torch>=2.5.1",
    "gflownet @ git+https://github.com/alexhernandezgarcia/gflownet.git@main",
    "hydra-core >=1.3.2",
]

[project.optional-dependencies]
wandb = ["wandb"]
comet = ["comet_ml"]
aim = ["aim"]
molecules = [
    "minimol==1.3.5",
    "selfies>=2.2.0",
    "rdkit>=2026.3.1",
    "transformers==4.35.2",
    "huggingface-hub>=0.34.3",
    # MiniMol imports pkg_resources, which was removed from newer setuptools.
    "setuptools<81",
    # Graphium's compiled PyG dependencies use local versions on Linux.
    "torch-cluster==1.6.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch-scatter==2.1.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch-sparse==0.6.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch-cluster==1.6.3+pt25cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch-scatter==2.1.2+pt25cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch-sparse==0.6.18+pt25cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pre-commit>=3.0",
    "zensical>=0.0.32",
    "sphinx>=8.1.3",
    "sphinx-autoapi>=3.8.0",
    "sphinx-rtd-theme>=3.1.0",
]

[project.scripts]
activelearning = "activelearning.main:main"

[tool.uv]
find-links = ["https://data.pyg.org/whl/torch-2.5.0+cpu.html"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build >= 0.9.26, <0.10.0"]
build-backend = "uv_build"
